version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: antojitos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: antojitos_db
      POSTGRES_USER: antojitos_user
      POSTGRES_PASSWORD: antojitos_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antojitos_user -d antojitos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
